spring:
  application:
    name: sistema-voto

  datasource:
    url: jdbc:mysql://localhost:3306/sistema_voto
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-256-bits-en-produccion-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    # Orígenes del frontend permitidos a llamar esta API (separados por coma).
    # En despliegue, sobreescribir con la variable de entorno CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}